[project]
name = "babi-agentscope"
version = "1.0.0"
description = "A coding agent application built with AgentScope"
requires-python = ">=3.10"
dependencies = [
    "agentscope>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "apscheduler>=3.10",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
babi-as = "babi.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["babi*"]

[tool.ruff]
line-length = 120
target-version = "py310"
